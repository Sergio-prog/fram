[project]
name = "fram"
version = "0.1.0"
description = "A compact media workshop for terminal, API, and Telegram."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Video",
]
dependencies = [
  "aiogram>=3.4",
  "fastapi>=0.111",
  "ffmpeg-python>=0.2",
  "pillow>=10.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "python-multipart>=0.0.9",
  "textual>=0.58",
  "textual-image[textual]>=0.12",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/Sergio-prog/fram"
Repository = "https://github.com/Sergio-prog/fram"
Issues = "https://github.com/Sergio-prog/fram/issues"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "ruff>=0.4",
]

[project.scripts]
fram = "fram.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fram"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
